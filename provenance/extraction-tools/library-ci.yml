name: SharedKernel validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
      - name: Verify selection fallback and extraction boundaries
        run: python3 scripts/sharedkernel/test-workflow.py
      - name: Select affected projects
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          args=()
          if [[ -n "${BASE_SHA}" ]]; then args+=(--base "${BASE_SHA}"); fi
          python3 scripts/sharedkernel/select-projects.py "${args[@]}"
      - name: Build, test, validate APIs and candidate packages
        run: python3 scripts/sharedkernel/validate.py --pack
      - name: Upload selection reasons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selection-and-reasons
          path: TestResults/selection/*.txt
          if-no-files-found: error
      - name: Retain candidate artifacts for separate consumer compatibility
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-packages
          path: |
            artifacts/api-compat/packages/**/*.nupkg
            artifacts/api-compat/packages/**/*.snupkg
            artifacts/api-compat/packages/**/candidate.json
          if-no-files-found: error
          retention-days: 14
  windows-package-consumption:
    needs: library
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-packages
          path: artifacts/candidate
      - name: Consume the same candidate packages on Windows
        shell: bash
        run: |
          python scripts/sharedkernel/windows-consumption.py
      - name: Retain Windows compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-package-evidence
          path: artifacts/candidate/**/candidate.json
          if-no-files-found: error
