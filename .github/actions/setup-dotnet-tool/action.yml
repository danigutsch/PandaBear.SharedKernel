name: Set up repository tooling
description: >-
  Set up the .NET SDK pinned by global.json with the lock-file NuGet cache, restore a repository-owned
  .NET CLI project in locked mode, and build it in Release. A stale lock file fails the restore.
inputs:
  project:
    description: Tool project to restore and build, relative to working-directory.
    required: true
  global-json-file:
    description: Path of the global.json that pins the SDK, relative to the workspace.
    required: false
    default: global.json
  working-directory:
    description: Directory, relative to the workspace, from which the project is restored and built.
    required: false
    default: .
  cache-dependency-path:
    description: Glob of the lock files that key the NuGet cache, relative to the workspace.
    required: false
    default: '**/packages.lock.json'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        global-json-file: ${{ inputs.global-json-file }}
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Build the selected repository tool
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CI_TOOL_PROJECT: ${{ inputs.project }}
      run: |
        dotnet restore "$CI_TOOL_PROJECT" --locked-mode
        dotnet build "$CI_TOOL_PROJECT" -c Release --no-restore
