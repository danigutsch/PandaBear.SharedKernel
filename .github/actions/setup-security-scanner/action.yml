name: Set up security scanner
description: Install the reviewed Gitleaks binary using a committed SHA-256 pin.
runs:
  using: composite
  steps:
    - name: Install pinned Gitleaks
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo 'The security scanner installer supports Linux X64 runners only.' >&2
          exit 1
        fi
        scanner_directory="$(mktemp -d "$RUNNER_TEMP/sharedkernel-security.XXXXXX")"
        cd "$scanner_directory"
        curl --fail --silent --show-error --location --retry 3 \
          --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --output gitleaks_8.30.1_linux_x64.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        sha256sum --check "$GITHUB_ACTION_PATH/checksums.txt"
        tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
        ./gitleaks version
        echo "$scanner_directory" >> "$GITHUB_PATH"
