name: Download the selection CI tool
description: Retrieve the selection job's compiled Linux tool from this workflow run and check its source and hashes.
inputs:
  artifact-id:
    description: Numeric artifact ID reported by the selection job.
    required: true
runs:
  using: composite
  steps:
    - name: Require the selection artifact ID
      shell: bash
      env:
        CI_TOOL_ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        [[ "$CI_TOOL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/sharedkernel-ci-tool
        merge-multiple: true
    - name: Verify the selection tool for the checked-out revision
      shell: bash
      run: |
        checked_out="$(git rev-parse HEAD)"
        cd "$RUNNER_TEMP/sharedkernel-ci-tool"
        test "$(cat revision)" = "$checked_out"
        test -f SharedKernel.CI.Tool.dll
        sha256sum --check --strict checksums.sha256
