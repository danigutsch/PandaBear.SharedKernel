name: PR Metadata (reusable)
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest
      source-repository:
        description: >-
          Repository that holds the CI tool source, such as danigutsch/PandaBear.SharedKernel. Empty builds the tool
          from the calling repository.
        type: string
        default: ''
      source-ref:
        description: >-
          Full 40-character commit SHA of the tool source. Required when source-repository is set; empty uses the
          event revision of the calling repository.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  metadata:
    name: Validate squash header
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a pinned tool source
        env:
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          if [[ -n "$SOURCE_REPOSITORY" && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source-ref must be a full 40-character lowercase commit SHA when source-repository is set." >&2
            exit 1
          fi
      - name: Checkout the CI tool source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref }}
          path: tool-source
          persist-credentials: false
          sparse-checkout: |
            tools/SharedKernel.CI.Tool
            tools/Shared
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: tool-source/global.json
      - name: Build the CI tool
        working-directory: tool-source
        run: |
          dotnet restore tools/SharedKernel.CI.Tool --locked-mode
          dotnet build tools/SharedKernel.CI.Tool -c Release --no-restore
      - name: Validate squash header
        working-directory: tool-source
        run: dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- verify-commit-message --event "$GITHUB_EVENT_PATH"
