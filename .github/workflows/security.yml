name: Security baseline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.RepoConfig.Tool
      - name: Verify baseline
        run: dotnet run --project tools/SharedKernel.RepoConfig.Tool -c Release --no-build --no-restore -- security baseline --root .
      - name: Restore locked security test dependencies
        run: dotnet restore tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj --locked-mode
      - name: Test security tooling
        run: dotnet test --project tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj -c Release --no-restore --filter-class '*Security*' --minimum-expected-tests 20
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.RepoConfig.Tool
      - uses: ./.github/actions/setup-security-scanner
      - name: Restore locked security test dependencies
        run: dotnet restore tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj --locked-mode
      - name: Verify installed scanner detection and redaction
        run: dotnet test --project tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj -c Release --no-restore --filter-class '*InstalledSecurityScannerTests' --explicit only --minimum-expected-tests 1
      - name: Scan current repository
        run: dotnet run --project tools/SharedKernel.RepoConfig.Tool -c Release --no-build --no-restore -- security scan --root . --output TestResults/security
      - name: Retain redacted report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-sarif
          path: TestResults/security/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
