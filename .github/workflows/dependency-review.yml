name: Dependency Review
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: true
jobs:
  snapshots:
    name: Dependency snapshot (${{ matrix.target }})
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["base", "head"]') || fromJSON('["head"]') }}
    permissions:
      contents: write
    uses: ./.github/workflows/dependency-snapshot-reusable.yml
    with:
      target: ${{ matrix.target }}
      correlator: sharedkernel-solution-nuget

  review:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Dependency Review' }}
    needs: snapshots
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-review-reusable.yml
    with:
      snapshot-result: ${{ needs.snapshots.result }}
      allow-licenses: >-
        MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PostgreSQL, Zlib,
        Unlicense, CC0-1.0
