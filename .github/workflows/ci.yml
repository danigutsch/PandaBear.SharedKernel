name: SharedKernel validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Published prerelease to consume unchanged on Linux and Windows; leave empty for normal validation.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && inputs.candidate_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.selection.outputs.build_required }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - name: Select affected test projects
        id: selection
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- select --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Upload selection reasons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selection-and-reasons
          path: TestResults/selection/*
          if-no-files-found: error

  validate:
    needs: selection
    if: needs.selection.outputs.build_required == 'true' && needs.selection.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: selection-and-reasons
          path: TestResults/selection
      - name: Run the selected test projects of the slice
        env:
          DOTNET_CLI_CONTEXT_VERBOSE: 'true'
          SLICE: ${{ matrix.slice }}
        run: dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- run --slice "$SLICE" --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.slice }}-evidence
          path: TestResults/selection/execution-${{ matrix.slice }}/**
          if-no-files-found: ignore

  source-build:
    needs: selection
    if: needs.selection.outputs.build_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tool: [SharedKernel.CI.Tool, SharedKernel.RepoConfig.Tool]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source-build
          persist-credentials: false
          sparse-checkout: |
            tools/${{ matrix.tool }}
            tools/Shared
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: source-build/global.json
      - name: Build the tool from its sparse checkout
        working-directory: source-build
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
        run: dotnet build "tools/$TOOL" -c Release
      - name: Run the tool from outside its checkout
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
        run: dotnet run --project "source-build/tools/$TOOL" -c Release --no-build -- --help

  candidate:
    needs: selection
    if: needs.selection.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - name: Calculate coordinated package version
        id: version
        env:
          VERSION_RUN: ${{ github.run_number }}.${{ github.run_attempt }}
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- calculate-release --version-kind prerelease --run-number "$VERSION_RUN" --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Create immutable package candidate
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- create-candidate --version "$PACKAGE_VERSION"
      - name: Retain candidate artifacts for separate consumer compatibility
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-packages
          path: |
            artifacts/api-compat/packages/*/*.nupkg
            artifacts/api-compat/packages/*/*.snupkg
            artifacts/api-compat/packages/*/candidate.json
          if-no-files-found: error
          retention-days: 14

  linux-package-consumption:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-packages
          path: artifacts/candidate
      - name: Consume the same candidate packages on Linux
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate-directory artifacts/candidate --aot
      - name: Retain Linux compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-package-evidence
          path: artifacts/candidate/**/candidate.json
          if-no-files-found: error

  windows-package-consumption:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-packages
          path: artifacts/candidate
      - name: Consume the same candidate packages on Windows
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate-directory artifacts/candidate --aot
      - name: Validate Windows setup and workflow contracts
        shell: pwsh
        run: |
          dotnet restore tests/SharedKernel.Testing.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Testing.Tests/SharedKernel.Testing.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.Versioning.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Versioning.Tests/SharedKernel.Versioning.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.Repository.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Repository.Tests/SharedKernel.Repository.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.K6.Tool.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.K6.Tool.Tests/SharedKernel.K6.Tool.Tests.csproj -c Release --no-restore
          exit $LASTEXITCODE
      - name: Retain Windows compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-package-evidence
          path: artifacts/candidate/**/candidate.json
          if-no-files-found: error

  repository-quality:
    needs: selection
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
      - name: Bootstrap from clean checkout
        if: needs.selection.outputs.build_required == 'true'
        run: bash setup-dev.sh
      - name: Validate setup and workflow contracts
        if: needs.selection.outputs.build_required == 'true'
        run: |
          dotnet test --project tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj -c Release --no-build --no-restore
          dotnet test --project tests/SharedKernel.Repository.Tests/SharedKernel.Repository.Tests.csproj -c Release --no-build --no-restore
      - name: Check governed literals against every library of the solution build
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet test --project tests/SharedKernel.Style.Analyzers.Tests/SharedKernel.Style.Analyzers.Tests.csproj -c Release --no-build --no-restore --explicit only
      - name: Verify formatting
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet format SharedKernel.slnx --verify-no-changes --no-restore
      - name: Build only documentation tooling for documentation changes
        if: needs.selection.outputs.build_required == 'false'
        uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Documentation.Tool
      - name: Verify generated architecture
        run: dotnet run --project tools/SharedKernel.Documentation.Tool -c Release --no-build --no-restore -- verify --config docs/architecture/generated-diagrams.json

  published-candidate-consumption:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Read the published prerelease manifest
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*$') {
            throw 'A prerelease package version is required.'
          }
          $releaseJson = gh release view "v$env:CANDIDATE_VERSION" --repo $env:GITHUB_REPOSITORY --json isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the published prerelease.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isPrerelease -ne $true) { throw 'The release must remain prerelease.' }
          $directory = Join-Path $env:RUNNER_TEMP 'published-candidate'
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download "v$env:CANDIDATE_VERSION" --repo $env:GITHUB_REPOSITORY --dir $directory --pattern candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the candidate manifest.' }
          $candidate = Get-Content -Raw (Join-Path $directory 'candidate.json') | ConvertFrom-Json
          if ($candidate.packageVersion -cne $env:CANDIDATE_VERSION -or $candidate.libraryDirty -ne $false) {
            throw 'The candidate must identify the requested version and a clean library revision.'
          }
          $expectedAssets = @($candidate.packageSha256.PSObject.Properties.Name | Sort-Object)
          $actualAssets = @($release.assets.name | Where-Object { $_ -like '*.nupkg' } | Sort-Object)
          if ($expectedAssets.Count -eq 0 -or (Compare-Object $expectedAssets $actualAssets -CaseSensitive)) {
            throw 'The release packages must exactly match the manifest.'
          }
          if ($candidate.libraryRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate source revision.' }
          "library_revision=$($candidate.libraryRevision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.candidate.outputs.library_revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - name: Stage the prerelease packages after checking the clean source revision
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'published-candidate/candidate.json'
          $feed = Join-Path $env:RUNNER_TEMP 'published-candidate/feed'
          dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- stage-candidate --pin $manifest --library-root . --output $feed --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package hashes and consume the same candidate including NativeAOT
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'published-candidate/feed/candidate.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'published-candidate/consumption.json'
          dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate $staged --output $evidence --aot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain platform evidence without rewriting release assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-candidate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/published-candidate/candidate.json
            ${{ runner.temp }}/published-candidate/consumption.json
          if-no-files-found: ignore

  validation-summary:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'SharedKernel Validation' }}
    needs: [selection, validate, source-build, candidate, linux-package-consumption, windows-package-consumption, repository-quality, published-candidate-consumption]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation result
        env:
          PUBLISHED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PUBLISHED_CANDIDATE_RESULT: ${{ needs.published-candidate-consumption.result }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          QUALITY_RESULT: ${{ needs.repository-quality.result }}
          BUILD_REQUIRED: ${{ needs.selection.outputs.build_required }}
          MATRIX: ${{ needs.selection.outputs.matrix }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SOURCE_BUILD_RESULT: ${{ needs.source-build.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          LINUX_RESULT: ${{ needs.linux-package-consumption.result }}
          WINDOWS_RESULT: ${{ needs.windows-package-consumption.result }}
        run: |
          if [[ -n "$PUBLISHED_CANDIDATE_VERSION" ]]; then
            test "$PUBLISHED_CANDIDATE_RESULT" = success
            exit $?
          fi
          test "$SELECTION_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [[ "$BUILD_REQUIRED" == true ]]; then
            if [[ "$MATRIX" == '[]' ]]; then
              test "$VALIDATE_RESULT" = skipped || exit 1
            else
              test "$VALIDATE_RESULT" = success || exit 1
            fi
            for result in "$SOURCE_BUILD_RESULT" "$CANDIDATE_RESULT" "$LINUX_RESULT" "$WINDOWS_RESULT"; do
              test "$result" = success || exit 1
            done
          elif [[ "$BUILD_REQUIRED" != false ]]; then
            echo "Missing selection evidence." >&2
            exit 1
          fi
