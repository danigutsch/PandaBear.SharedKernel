name: SharedKernel validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Published prerelease to consume unchanged on Linux and Windows; leave empty for normal validation.
        required: false
        type: string
      baseline_candidate_version:
        description: Earlier published prerelease for an API comparison. Requires candidate_version.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && inputs.candidate_version == '' && inputs.baseline_candidate_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.selection.outputs.build_required }}
      full_validation: ${{ steps.selection.outputs.full_validation }}
      matrix: ${{ steps.selection.outputs.matrix }}
      candidate_required: ${{ steps.selection.outputs.candidate_required }}
      ci_tool_artifact_id: ${{ steps.ci-tool-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - name: Select affected test projects
        id: selection
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- select --base "$BASE_SHA" --candidate-excluded-source "benchmarks/**/*.cs" --github-output "$GITHUB_OUTPUT"
      - name: Upload selection reasons
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-and-reasons
          path: TestResults/selection/*
          if-no-files-found: error
      - name: Stage the compiled CI tool and its checkout identity
        if: steps.selection.outputs.build_required == 'true' && steps.selection.outputs.matrix != '[]'
        shell: bash
        run: |
          shopt -s nullglob
          tools=(tools/SharedKernel.CI.Tool/bin/Release/*/SharedKernel.CI.Tool.dll)
          test "${#tools[@]}" -eq 1
          directory="$RUNNER_TEMP/sharedkernel-ci-tool"
          mkdir "$directory"
          cp -R "$(dirname "${tools[0]}")"/. "$directory/"
          git rev-parse HEAD > "$directory/revision"
          (
            cd "$directory"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/sharedkernel-ci-tool.sha256"
          mv "$RUNNER_TEMP/sharedkernel-ci-tool.sha256" "$directory/checksums.sha256"
      - name: Upload the selection CI tool
        id: ci-tool-artifact
        if: steps.selection.outputs.build_required == 'true' && steps.selection.outputs.matrix != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-ci-tool-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sharedkernel-ci-tool
          if-no-files-found: error

  validate:
    needs: selection
    if: needs.selection.outputs.build_required == 'true' && needs.selection.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
      - uses: ./.github/actions/download-selection-tool
        with:
          artifact-id: ${{ needs.selection.outputs.ci_tool_artifact_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selection-and-reasons
          path: TestResults/selection
      - name: Run the selected test projects of the slice
        env:
          DOTNET_CLI_CONTEXT_VERBOSE: 'true'
          SLICE: ${{ matrix.slice }}
          REQUIRE_BROWSER_TESTS: 'true'
        run: dotnet "$RUNNER_TEMP/sharedkernel-ci-tool/SharedKernel.CI.Tool.dll" run --slice "$SLICE" --coverage --install-playwright --playwright-dependencies --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.slice }}-evidence
          path: TestResults/selection/execution-${{ matrix.slice }}/**
          if-no-files-found: ignore

  coverage-gate:
    needs:
      - selection
      - validate
    if: ${{ github.event_name == 'pull_request' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
      - uses: ./.github/actions/download-selection-tool
        with:
          artifact-id: ${{ needs.selection.outputs.ci_tool_artifact_id }}
      - name: Download the affected build filter
        if: needs.selection.outputs.full_validation == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selection-and-reasons
          path: TestResults/selection
      - name: Build the selected projects in Release for symbol evidence
        env:
          SYMBOL_SOLUTION: ${{ needs.selection.outputs.full_validation == 'false' && 'TestResults/selection/affected.build.slnf' || 'SharedKernel.slnx' }}
        run: |
          dotnet restore "$SYMBOL_SOLUTION" --locked-mode
          dotnet build "$SYMBOL_SOLUTION" -c Release --no-restore
      - name: Record revision and symbol hashes
        run: dotnet "$RUNNER_TEMP/sharedkernel-ci-tool/SharedKernel.CI.Tool.dll" coverage record-symbols
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-*-evidence
          path: artifacts
      - name: Enforce changed-code coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: dotnet "$RUNNER_TEMP/sharedkernel-ci-tool/SharedKernel.CI.Tool.dll" coverage verify --report artifacts --base "$BASE_SHA" --symbols TestResults/symbol-evidence.json
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-gate-evidence
          path: TestResults/coverage-gate.json
          if-no-files-found: ignore

  source-build:
    needs: selection
    if: needs.selection.outputs.build_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tool: [SharedKernel.CI.Tool, SharedKernel.RepoConfig.Tool]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source-build
          persist-credentials: false
          sparse-checkout: |
            src
            tools
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: source-build/global.json
          cache: true
          cache-dependency-path: source-build/tools/${{ matrix.tool }}/packages.lock.json
      - name: Build the tool from its checkout
        working-directory: source-build
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
        run: dotnet build "tools/$TOOL" -c Release
      - name: Run the tool from outside its checkout
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
        run: dotnet run --project "source-build/tools/$TOOL" -c Release --no-build -- --help

  candidate:
    needs: selection
    if: >-
      needs.selection.outputs.build_required == 'true' &&
      (github.event_name != 'pull_request' || needs.selection.outputs.full_validation != 'false' ||
      needs.selection.outputs.matrix != '[]' || needs.selection.outputs.candidate_required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - name: Calculate coordinated package version
        id: version
        env:
          VERSION_RUN: ${{ github.run_number }}.${{ github.run_attempt }}
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- calculate --version-kind prerelease --run-number "$VERSION_RUN" --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Create immutable package candidate
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RECORD_SYMBOLS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danigutsch/PandaBear.SharedKernel' }}
        shell: bash
        run: |
          if [[ "$RECORD_SYMBOLS" == true ]]; then
            dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- create-candidate --version "$PACKAGE_VERSION" --record-symbols
          else
            dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- create-candidate --version "$PACKAGE_VERSION"
          fi
      - name: Verify Source Link for canonical main candidates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danigutsch/PandaBear.SharedKernel' }}
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          candidate_directory="artifacts/api-compat/packages/$PACKAGE_VERSION"
          test -s "$candidate_directory/symbols.sha256"
          dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- verify-candidate-source-link --candidate "$candidate_directory/candidate.json" --symbols "$candidate_directory/symbols.sha256" --source-url-pattern 'https://raw.githubusercontent.com/danigutsch/PandaBear.SharedKernel/{revision}/*' --tool-package PandaBear.SharedKernel.Packages.Tool --tool-package PandaBear.SharedKernel.Versioning.Tool --output "$candidate_directory/source-link-report.json"
          test -s "$candidate_directory/source-link-report.json"
      - name: Retain candidate artifacts for separate consumer compatibility
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-packages
          path: |
            artifacts/api-compat/packages/*/*.nupkg
            artifacts/api-compat/packages/*/*.snupkg
            artifacts/api-compat/packages/*/candidate.json
            artifacts/api-compat/packages/${{ steps.version.outputs.package_version }}/symbols.sha256
            artifacts/api-compat/packages/${{ steps.version.outputs.package_version }}/source-link-report.json
          if-no-files-found: error
          retention-days: 14

  linux-package-consumption:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-packages
          path: artifacts/candidate
      - name: Consume the same candidate packages on Linux
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate-directory artifacts/candidate --aot
      - name: Retain Linux compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-evidence
          path: artifacts/candidate/**/candidate.json
          if-no-files-found: error

  windows-package-consumption:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-packages
          path: artifacts/candidate
      - name: Consume the same candidate packages on Windows
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate-directory artifacts/candidate --aot
      - name: Validate Windows setup and workflow contracts
        shell: pwsh
        run: |
          dotnet restore tests/SharedKernel.Testing.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Testing.Tests/SharedKernel.Testing.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.Versioning.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Versioning.Tests/SharedKernel.Versioning.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.Repository.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Repository.Tests/SharedKernel.Repository.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.K6.Tool.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.K6.Tool.Tests/SharedKernel.K6.Tool.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/SharedKernel.Aspire.Hosting.K6.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SharedKernel.Aspire.Hosting.K6.Tests/SharedKernel.Aspire.Hosting.K6.Tests.csproj -c Release --no-restore
          exit $LASTEXITCODE
      - name: Retain Windows compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-evidence
          path: artifacts/candidate/**/candidate.json
          if-no-files-found: error

  repository-quality:
    needs: selection
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
      - name: Download pull request validation plan
        if: needs.selection.outputs.build_required == 'true' && github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selection-and-reasons
          path: TestResults/selection
      - name: Bootstrap from clean checkout
        if: needs.selection.outputs.build_required == 'true' && (github.event_name != 'pull_request' || needs.selection.outputs.full_validation != 'false')
        run: bash setup-dev.sh
      - name: Build required and affected projects for repository quality
        if: needs.selection.outputs.build_required == 'true' && github.event_name == 'pull_request' && needs.selection.outputs.full_validation == 'false'
        run: |
          dotnet restore SharedKernel.slnx --locked-mode
          dotnet build TestResults/selection/quality.build.slnf -c Release --no-restore
      - name: Validate setup and workflow contracts
        if: needs.selection.outputs.build_required == 'true'
        run: |
          dotnet test --project tests/SharedKernel.RepoConfig.Tests/SharedKernel.RepoConfig.Tests.csproj -c Release --no-build --no-restore
          dotnet test --project tests/SharedKernel.Repository.Tests/SharedKernel.Repository.Tests.csproj -c Release --no-build --no-restore
      - name: Check governed literals against every library of the solution build
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet test --project tests/SharedKernel.Style.Analyzers.Tests/SharedKernel.Style.Analyzers.Tests.csproj -c Release --no-build --no-restore --explicit only
      - name: Verify pinned third-party actions
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet run --project tools/SharedKernel.RepoConfig.Tool -c Release --no-build --no-restore -- verify-action-pins
      - name: Report test taxonomy
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet run --project tools/SharedKernel.RepoConfig.Tool -c Release --no-build --no-restore -- verify-test-taxonomy --report
      - name: Verify lock coverage of the lock-free libraries
        if: needs.selection.outputs.build_required == 'true'
        run: dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- verify-lock-coverage
      - name: Verify formatting of selected files
        if: needs.selection.outputs.build_required == 'true' && github.event_name == 'pull_request'
        run: dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- verify-format
      - name: Verify full solution formatting
        if: needs.selection.outputs.build_required == 'true' && github.event_name != 'pull_request'
        run: dotnet format SharedKernel.slnx --verify-no-changes --no-restore
      - name: Build only documentation tooling for documentation changes
        if: needs.selection.outputs.build_required == 'false'
        uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Documentation.Tool
      - name: Verify generated architecture
        run: dotnet run --project tools/SharedKernel.Documentation.Tool -c Release --no-build --no-restore -- verify --config docs/architecture/generated-diagrams.json

  published-candidate-consumption:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version != '' && inputs.candidate_version != inputs.baseline_candidate_version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the published prerelease manifest
        id: candidate
        uses: ./.github/actions/read-published-candidate
        with:
          version: ${{ inputs.candidate_version }}
          directory: published-candidate
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.candidate.outputs.library_revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - name: Stage the prerelease packages after checking the clean source revision
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'published-candidate/candidate.json'
          $feed = Join-Path $env:RUNNER_TEMP 'published-candidate/feed'
          dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- stage-candidate --pin $manifest --library-root . --output $feed --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package hashes and consume the same candidate including NativeAOT
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'published-candidate/feed/candidate.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'published-candidate/consumption.json'
          dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- consume-candidate --candidate $staged --output $evidence --aot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain platform evidence without rewriting release assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-candidate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/published-candidate/candidate.json
            ${{ runner.temp }}/published-candidate/consumption.json
          if-no-files-found: ignore

  published-candidate-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version != '' && inputs.baseline_candidate_version != '' && inputs.candidate_version != inputs.baseline_candidate_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the published baseline manifest
        id: baseline
        uses: ./.github/actions/read-published-candidate
        with:
          version: ${{ inputs.baseline_candidate_version }}
          directory: published-api-comparison/baseline
      - name: Read the published candidate manifest
        id: candidate
        uses: ./.github/actions/read-published-candidate
        with:
          version: ${{ inputs.candidate_version }}
          directory: published-api-comparison/candidate
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.CI.Tool
      - uses: ./.github/actions/setup-dotnet-tool
        with:
          project: tools/SharedKernel.Versioning.Tool
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.baseline.outputs.library_revision }}
          path: comparison-baseline-source
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.candidate.outputs.library_revision }}
          path: comparison-candidate-source
          persist-credentials: false
      - name: Stage both immutable prereleases after checking their source revisions
        id: stage
        shell: bash
        run: |
          for role in baseline candidate; do
            directory="${RUNNER_TEMP}/published-api-comparison/${role}"
            source="${GITHUB_WORKSPACE}/comparison-${role}-source"
            dotnet run --project tools/SharedKernel.CI.Tool -c Release --no-build --no-restore -- stage-candidate \
              --root "${source}" --library-root "${source}" --pin "${directory}/candidate.json" \
              --output "${directory}/feed" --repository "$GITHUB_REPOSITORY"
          done
      - name: Install the pinned ApiCompat tool
        shell: bash
        run: |
          dotnet tool install Microsoft.DotNet.ApiCompat.Tool --version 11.0.100 \
            --tool-path "${RUNNER_TEMP}/published-api-comparison/apicompat"
      - name: Compare the published candidates
        id: compare
        shell: bash
        run: |
          directory="${RUNNER_TEMP}/published-api-comparison"
          report="${directory}/api-comparison.json"
          if dotnet run --project tools/SharedKernel.Versioning.Tool -c Release --no-build --no-restore -- compare-candidates --baseline "${directory}/baseline/feed/candidate.json" --candidate "${directory}/candidate/feed/candidate.json" --apicompat "${directory}/apicompat/apicompat" --output "${report}"
          then
            status=0
          else
            status=$?
          fi
          case "${status}" in
            0|3) test -s "${report}" ;;
            *) exit "${status}" ;;
          esac
      - name: Record comparison failure status
        if: failure()
        shell: bash
        env:
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
          CANDIDATE_RESULT: ${{ steps.candidate.outcome }}
          STAGING_RESULT: ${{ steps.stage.outcome }}
          COMPARISON_RESULT: ${{ steps.compare.outcome }}
        run: |
          directory="${RUNNER_TEMP}/published-api-comparison"
          mkdir -p "${directory}"
          printf 'Baseline manifest %s\nCandidate manifest %s\nArchive staging %s\nAPI comparison %s\n' \
            "${BASELINE_RESULT}" "${CANDIDATE_RESULT}" "${STAGING_RESULT}" "${COMPARISON_RESULT}" \
            > "${directory}/comparison-failure.txt"
      - name: Retain the API comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-candidate-api-comparison
          path: |
            ${{ runner.temp }}/published-api-comparison/api-comparison.json
            ${{ runner.temp }}/published-api-comparison/comparison-failure.txt
          if-no-files-found: ignore

  validation-summary:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'SharedKernel Validation' }}
    needs: [selection, validate, coverage-gate, source-build, candidate, linux-package-consumption, windows-package-consumption, repository-quality, published-candidate-consumption, published-candidate-comparison]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation result
        env:
          PUBLISHED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PUBLISHED_BASELINE_VERSION: ${{ inputs.baseline_candidate_version }}
          PUBLISHED_CANDIDATE_RESULT: ${{ needs.published-candidate-consumption.result }}
          PUBLISHED_COMPARISON_RESULT: ${{ needs.published-candidate-comparison.result }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          QUALITY_RESULT: ${{ needs.repository-quality.result }}
          BUILD_REQUIRED: ${{ needs.selection.outputs.build_required }}
          FULL_VALIDATION: ${{ needs.selection.outputs.full_validation }}
          MATRIX: ${{ needs.selection.outputs.matrix }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BUILD_RESULT: ${{ needs.source-build.result }}
          CANDIDATE_REQUIRED: ${{ needs.selection.outputs.candidate_required }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          LINUX_RESULT: ${{ needs.linux-package-consumption.result }}
          WINDOWS_RESULT: ${{ needs.windows-package-consumption.result }}
        run: |
          if [[ -n "$PUBLISHED_BASELINE_VERSION" && -z "$PUBLISHED_CANDIDATE_VERSION" ]]; then
            echo "baseline_candidate_version requires candidate_version." >&2
            exit 1
          fi
          if [[ -n "$PUBLISHED_BASELINE_VERSION" && "$PUBLISHED_BASELINE_VERSION" == "$PUBLISHED_CANDIDATE_VERSION" ]]; then
            echo "Select different baseline_candidate_version and candidate_version values." >&2
            exit 1
          fi
          if [[ -n "$PUBLISHED_CANDIDATE_VERSION" ]]; then
            test "$PUBLISHED_CANDIDATE_RESULT" = success || exit 1
            if [[ -n "$PUBLISHED_BASELINE_VERSION" ]]; then
              test "$PUBLISHED_COMPARISON_RESULT" = success || exit 1
            fi
            exit 0
          fi
          test "$SELECTION_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [[ "$BUILD_REQUIRED" == true ]]; then
            if [[ "$MATRIX" == '[]' ]]; then
              test "$VALIDATE_RESULT" = skipped || exit 1
            else
              test "$VALIDATE_RESULT" = success || exit 1
            fi
            test "$SOURCE_BUILD_RESULT" = success || exit 1
            expected_package_result=success
            if [[ "$EVENT_NAME" == pull_request && "$FULL_VALIDATION" == false && "$MATRIX" == '[]' && "$CANDIDATE_REQUIRED" == false ]]; then
              expected_package_result=skipped
            fi
            for result in "$CANDIDATE_RESULT" "$LINUX_RESULT" "$WINDOWS_RESULT"; do
              test "$result" = "$expected_package_result" || exit 1
            done
            if [[ "$EVENT_NAME" == pull_request && "$MATRIX" != '[]' ]]; then
              test "$COVERAGE_RESULT" = success || exit 1
            fi
          elif [[ "$BUILD_REQUIRED" != false ]]; then
            echo "Missing selection evidence." >&2
            exit 1
          fi
