name: Actionlint
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: ./.github/workflows/actionlint-reusable.yml
    with:
      actionlint-sha256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
